# Test configuration.
#
# Integration tests run against a real MySQL instance rather than an embedded H2, because the
# driver search uses MySQL-specific geo SQL (ST_Distance_Sphere) and the active-ride guarantee
# relies on MySQL's "unique indexes ignore NULLs" behaviour. An H2 dialect that silently accepted
# different SQL would produce a false green on exactly the claims worth verifying.
#
# Supply the password once per shell:  export MYSQL_PASSWORD='...'
# The unit tests covering the pricing engine need none of this — they run without Spring.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/plazza_test?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

# Mirrors the shipped rate cards. Integration tests assert fares end to end, so these must match
# application.yml; the pure pricing unit tests build their own cards and are unaffected by this.
pricing:
  cards:
    HATCHBACK:
      minimum-fare: 40
      tiers:
        - { from-km: 0, to-km: 2,      rate-per-km: 8 }
        - { from-km: 2, to-km: 5,      rate-per-km: 6 }
        - { from-km: 5, to-km: 100000, rate-per-km: 4 }
    SEDAN:
      minimum-fare: 50
      tiers:
        - { from-km: 0, to-km: 2,      rate-per-km: 10 }
        - { from-km: 2, to-km: 5,      rate-per-km: 8 }
        - { from-km: 5, to-km: 100000, rate-per-km: 5 }

booking:
  default-radius-km: 5
matching:
  strategy: nearest
