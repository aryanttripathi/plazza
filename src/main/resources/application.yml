spring:
  application:
    name: plazza

  # Default to the local profile so running PlazzaApplication straight from an IDE picks up
  # application-local.yml without extra run configuration. Override with SPRING_PROFILES_ACTIVE.
  # A checkout without that file is unaffected: an absent profile document is simply skipped, and
  # credentials then come from MYSQL_USER / MYSQL_PASSWORD below.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://localhost:3306/plazza?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    # Never commit a real credential. Supply it via the MYSQL_PASSWORD environment variable,
    # or via the git-ignored application-local.yml profile.
    password: ${MYSQL_PASSWORD:Aryant@20}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Exercise-scope choice: the schema is derived from the entities. Production wants Flyway
      # migrations plus ddl-auto=validate, which is recorded in the README as future work.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Stated explicitly rather than probed from a live connection. Without it, any connection
        # failure surfaces as "Unable to determine Dialect without JDBC metadata", which sends you
        # hunting for a dialect problem when the real cause is a bad password or a stopped server.
        dialect: org.hibernate.dialect.MySQLDialect

# Pricing is data, not code. A new car type is a block here; a new slab is a row.
# Slabs are half-open [fromKm, toKm), must start at 0, and must be contiguous —
# RateCardRegistry validates that on startup rather than mispricing quietly.
pricing:
  cards:
    HATCHBACK:
      minimum-fare: 40
      tiers:
        - { from-km: 0, to-km: 2,      rate-per-km: 8 }
        - { from-km: 2, to-km: 5,      rate-per-km: 6 }
        - { from-km: 5, to-km: 100000, rate-per-km: 4 }
    SEDAN:
      minimum-fare: 50
      tiers:
        - { from-km: 0, to-km: 2,      rate-per-km: 10 }
        - { from-km: 2, to-km: 5,      rate-per-km: 8 }
        - { from-km: 5, to-km: 100000, rate-per-km: 5 }

booking:
  # Riders can override per request; this is the fallback search radius.
  default-radius-km: 5

matching:
  # Swappable without touching booking logic: nearest | highestRated
  strategy: nearest

logging:
  level:
    org.plazza.plazza: DEBUG
